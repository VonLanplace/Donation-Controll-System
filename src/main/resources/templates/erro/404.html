<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Registro não encontrado</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Registro não encontrado</h1>

  <div class="card">
    <div class="card-body">
      <p>Não foi possível localizar o registro pedido.</p>
      <p class="vazio" th:if="${detalhe}" th:text="${detalhe}">Detalhe do erro.</p>
      <p>
        <a class="botao botao-primario" th:href="@{/}">Voltar ao início</a>
      </p>
    </div>
  </div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
