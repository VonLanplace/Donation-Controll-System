<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Produto</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Produto</h1>

  <div class="card">
    <div class="card-header">
      <span th:text="${produto.codigoBarras} ?: 'Produto sem código'">7891000100103</span>
      <a class="botao" th:href="@{/produto}">Voltar</a>
    </div>
    <div class="card-body">

      <table class="tabela">
        <tbody>
        <tr>
          <th>Código de barras</th>
          <td th:text="${produto.codigoBarras} ?: '—'">—</td>
        </tr>
        <tr>
          <th>Marca</th>
          <!--
            Marca e tipo são opcionais no domínio: ProdutoResponseDTO aninha o
            nome, não o id, e o produto pode existir sem nenhum dos dois.
          -->
          <td th:text="${produto.marcaProduto?.nome} ?: '—'">—</td>
        </tr>
        <tr>
          <th>Tipo</th>
          <td th:text="${produto.tipoProduto?.nome} ?: '—'">—</td>
        </tr>
        <tr>
          <th>Identificador</th>
          <td th:text="${produto.id}">—</td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
