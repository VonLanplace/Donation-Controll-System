<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Produtos</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Produtos</h1>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <!--
    Busca por código de barras. GET e não POST porque é consulta, e o resultado
    fica na URL: o usuário pode marcar, mandar e voltar. O hidden de ordenação
    carrega o ?sort= corrente, senão a busca volta com a ordenação padrão.
  -->
  <form class="form-busca" method="get" th:action="@{/produto/listar}">
    <input type="hidden" name="sort" th:value="${ordenacao}">
    <input type="text" name="busca" th:value="${busca}"
           placeholder="Código de barras" aria-label="Buscar por código de barras">
    <button class="botao botao-primario" type="submit">Buscar</button>
    <a class="botao" th:if="${!#strings.isEmpty(busca)}" th:href="@{/produto/listar}">Limpar</a>
  </form>

  <div class="card">
    <div class="card-header">
      <span>Produtos cadastrados</span>
    </div>
    <div class="card-body">

      <table class="tabela">
        <thead>
        <tr>
          <th>Código de barras</th>
          <th>Marca</th>
          <th>Tipo</th>
          <th class="acoes">Ações</th>
        </tr>
        </thead>
        <!--
          th:each sobre page.content, e não sobre a Page inteira.
          A versão anterior usava #lists.isEmpty(produtos) com uma Page<DTO> no
          modelo: Page não é List, o SpEL estoura na conversão de tipo e a página
          devolvia 500 antes mesmo de chegar no ${produto.nome}, que também não
          existe no DTO.
        -->
        <tbody>
        <tr th:each="p : ${page.content}">
          <td th:text="${p.codigoBarras} ?: '—'">7891000100103</td>
          <td th:text="${p.marcaProduto?.nome} ?: '—'">Nike</td>
          <td th:text="${p.tipoProduto?.nome} ?: '—'">BEBIDA</td>
          <td class="acoes">
            <!--
              .botao-primario, e não .botao: a classe neutra pinta o fundo de
              --surface-color, que é exatamente a cor do .card-body embaixo. O
              botão ficava branco sobre branco e só a borda o separava da linha.
              Conferido por pixel: 5332 pixels #ffffff na faixa do botão.
            -->
            <a class="botao botao-primario" th:href="@{/produto/detalhe/{id}(id=${p.id})}">Ver</a>
            <a class="botao botao-pequeno" th:href="@{/produto/editar/{id}(id=${p.id})}">Editar</a>
            <form class="form-linha" method="post"
                  th:action="@{/produto/apagar/{id}(id=${p.id})}">
              <button class="botao botao-pequeno botao-perigo" type="submit">Apagar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>

      <p class="vazio" th:if="${page.empty}">Nenhum produto cadastrado até o momento.</p>

      <!--
        Botão de cadastro fica fora do card: é ação de página, não linha de
        tabela. Dentro do card-body ele herdaria o padding e pareceria mais um
        registro.
      -->
      <div class="pagina-acoes">
        <a class="botao botao-primario" th:href="@{/produto/create}">Novo produto</a>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pagination(@{/produto}, ${page}, ${ordenacao})}"></div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
