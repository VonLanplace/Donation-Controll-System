<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${titulo} ?: 'Meu Projeto'">Título padrão</title>

    <!-- Importação dos estilos globais -->
    <link rel="stylesheet" th:href="@{/css/cores.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/trail.css}">
    <link rel="stylesheet" th:href="@{/css/listar.css}">

    <!-- Bloco para CSS específico de cada página -->
    <th:block layout:fragment="page-css"></th:block>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; background-color: var(--background-color); color: var(--text-color);">

<!-- Header inserido via Thymeleaf -->
<div th:replace="fragments/header :: header"></div>

<!-- Conteúdo principal dinâmico das páginas -->
<main style="flex: 1; padding: 2rem;">
    <div layout:fragment="content">
        <table th:if="${not #lists.isEmpty(produtos)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iteração da lista de produtos -->
            <tr th:each="produto : ${produtos}">
                <td th:text="${produto.id}">1</td>
                <td th:text="${produto.nome}">Produto Exemplo</td>
                <td>
                    <!-- Exemplo de botão de ação -->
                    <a th:href="@{/produtos/editar/{id}(id=${produto.id})}">Editar</a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Mensagem exibida apenas se a lista estiver vazia -->
        <div class="empty-message" th:if="${#lists.isEmpty(produtos)}">
            Nenhum produto cadastrado até o momento.
        </div>
    </div>
</main>

<!-- Trail (Rodapé) inserido via Thymeleaf -->
<div th:replace="fragments/trail :: trail"></div>

<!-- Bloco para JS específico de cada página -->
<th:block layout:fragment="page-js"></th:block>

</body>
</html>
