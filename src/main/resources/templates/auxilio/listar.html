<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Auxílios</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Auxílios</h1>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="card">
    <div class="card-header">
      <span>Auxílios cadastrados</span>
    </div>
    <div class="card-body">

      <table class="tabela">
        <thead>
        <tr>
          <th>Valor</th>
          <th>Fonte</th>
          <th>Recebedor</th>
          <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${page.content}">
          <td th:text="|R$ ${#numbers.formatDecimal(a.valor, 1, 2, 'COMMA')}|">R$ 600,00</td>
          <td th:text="${a.fonte}">Bolsa Família</td>
          <td th:text="${a.recebedor.nomeCompleto}">João da Silva</td>
          <td class="acoes">
            <a class="botao botao-pequeno" th:href="@{/auxilio/editar/{id}(id=${a.id})}">Editar</a>
            <form class="form-linha" method="post"
                  th:action="@{/auxilio/apagar/{id}(id=${a.id})}">
              <button class="botao botao-pequeno botao-perigo" type="submit">Apagar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>

      <p class="vazio" th:if="${page.empty}">Nenhum auxílio cadastrado até o momento.</p>

      <div class="pagina-acoes">
        <a class="botao botao-primario" th:href="@{/auxilio/create}">Novo auxílio</a>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pagination(@{/auxilio}, ${page}, ${ordenacao})}"></div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
