<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('forms.css')}">
  <title th:text="${titulo}">Auxílio</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo" th:text="${titulo}">Novo auxílio</h1>

  <form method="post" th:object="${auxilioDTO}"
        th:action="${id != null} ? @{/auxilio/editar/{id}(id=${id})} : @{/auxilio/create}">

    <div class="card">
      <div class="card-header">
        <span th:text="${id != null} ? 'Dados do auxílio' : 'Dados do novo auxílio'">Dados</span>
      </div>
      <div class="card-body">

        <div th:replace="~{fragments/erros :: erros}"></div>

        <div class="form-grade">

          <div th:replace="~{fragments/campo :: campo('valor', 'Valor mensal', true, 'number')}"></div>
          <div th:replace="~{fragments/campo :: texto('fonte', 'Fonte', true)}"></div>
          <div th:replace="~{fragments/campo :: area('descricao', 'Descrição', false, true)}"></div>
          <div th:replace="~{fragments/campo :: selecao('recebedorId', 'Recebedor', true, ${recebedores})}"></div>

        </div>

        <div th:replace="~{fragments/campo :: acoes('Salvar', @{/auxilio/listar})}"></div>

      </div>
    </div>

  </form>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
