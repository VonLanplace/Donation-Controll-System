<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Selecionar recebedor</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Selecionar recebedor</h1>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="card">
    <div class="card-header">
      <span th:text="|Documento: ${documento}|">Documento: 1234567</span>
    </div>
    <div class="card-body">

      <p>Mais de um recebedor possui este RG. Escolha o correto:</p>

      <table class="tabela">
        <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Data de nascimento</th>
          <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${recebedores}">
          <td th:text="${r.nomeCompleto}">Ana Souza</td>
          <td th:text="${r.cpf}">00000000000</td>
          <td th:text="${#temporals.format(r.dataNascimento, 'dd/MM/yyyy')}">01/01/2000</td>
          <td class="acoes">
            <a class="botao botao-primario"
               th:href="@{/recebedor/detalhe/{id}(id=${r.id})}">Selecionar</a>
          </td>
        </tr>
        </tbody>
      </table>

      <div class="pagina-acoes">
        <a class="botao" th:href="@{/recebedor/listar}">Voltar</a>
      </div>

    </div>
  </div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
