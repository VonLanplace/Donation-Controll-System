<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Despesas</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Despesas</h1>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="card">
    <div class="card-header">
      <span>Despesas cadastradas</span>
    </div>
    <div class="card-body">

      <table class="tabela">
        <thead>
        <tr>
          <th>Valor</th>
          <th>Fonte</th>
          <th>Residência</th>
          <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dp : ${page.content}">
          <td th:text="|R$ ${#numbers.formatDecimal(dp.valor, 1, 2, 'COMMA')}|">R$ 1.250,00</td>
          <td th:text="${dp.fonte}">Aluguel</td>
          <td th:text="|${dp.residencia.logradouro}, ${dp.residencia.numero}|">Rua das Flores, 100</td>
          <td class="acoes">
            <a class="botao botao-pequeno" th:href="@{/despesa/editar/{id}(id=${dp.id})}">Editar</a>
            <form class="form-linha" method="post"
                  th:action="@{/despesa/apagar/{id}(id=${dp.id})}">
              <button class="botao botao-pequeno botao-perigo" type="submit">Apagar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>

      <p class="vazio" th:if="${page.empty}">Nenhuma despesa cadastrada até o momento.</p>

      <div class="pagina-acoes">
        <a class="botao botao-primario" th:href="@{/despesa/create}">Nova despesa</a>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pagination(@{/despesa}, ${page}, ${ordenacao})}"></div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
