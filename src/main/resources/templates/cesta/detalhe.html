<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
    <title>Cesta</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

    <h1 class="pagina-titulo" th:text="${cesta.dataEntrega != null ? #temporals.format(cesta.dataEntrega, 'dd/MM/yyyy') : 'Cesta'}">Cesta</h1>

    <div class="card">
        <div class="card-header">
            <span>Entrega</span>
        </div>
        <div class="card-body">

            <dl class="descricao">
                <dt>Data de entrega</dt>
                <dd th:text="${cesta.dataEntrega != null ? #temporals.format(cesta.dataEntrega, 'dd/MM/yyyy') : '—'}">01/02/2026</dd>

                <dt>Recebedor</dt>
                <dd>
                    <a th:if="${cesta.recebedor != null}" th:href="@{/recebedor/detalhe/{id}(id=${cesta.recebedor.id})}"
                       th:text="${cesta.recebedor.nomeCompleto}">Maria Souza</a>
                    <span th:if="${cesta.recebedor == null}" class="valor-nulo">sem recebedor vinculado</span>
                </dd>
            </dl>

            <div class="pagina-acoes">
                <a class="botao" th:href="@{/cesta/listar}">Voltar</a>
                <a class="botao botao-primario" th:href="@{/cesta/editar/{id}(id=${cesta.id})}">Editar</a>
            </div>

        </div>
    </div>

</main>

</body>
</html>
