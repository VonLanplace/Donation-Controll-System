<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Cestas</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}">header</div>

<main class="container">
    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="card tabela-card">
        <div class="card-header">
            <h2 th:text="${titulo}">Cestas</h2>
            <a th:href="@{/cesta/create}" class="botao">Nova cesta</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>Data de entrega</th>
                <th>Recebedor</th>
                <th class="coluna-acoes">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(page.content)}">
                <td colspan="3" class="sem-dados">Nenhuma cesta cadastrada.</td>
            </tr>
            <tr th:each="cesta : ${page.content}">
                <td th:text="${cesta.dataEntrega != null ? #temporals.format(cesta.dataEntrega, 'dd/MM/yyyy') : '—'}">01/01/2026</td>
                <td>
                    <a th:if="${cesta.recebedor != null}"
                       th:href="@{/recebedor/detalhe/{id}(id=${cesta.recebedor.id})}"
                       th:text="${cesta.recebedor.nomeCompleto}">Maria Souza</a>
                    <span th:if="${cesta.recebedor == null}" class="valor-nulo">sem recebedor</span>
                </td>
                <td class="coluna-acoes">
                    <a th:href="@{/cesta/detalhe/{id}(id=${cesta.id})}" class="botao-acao">Ver</a>
                    <a th:href="@{/cesta/editar/{id}(id=${cesta.id})}" class="botao-acao">Editar</a>
                    <form th:action="@{/cesta/apagar/{id}(id=${cesta.id})}" method="post"
                          onsubmit="return confirm('Apagar esta cesta?');">
                        <button type="submit" class="botao-acao perigo">Apagar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/pagination :: pagination('/cesta/listar', ${page}, ${ordenacao})}"></div>
    </div>
</main>

</body>
</html>
