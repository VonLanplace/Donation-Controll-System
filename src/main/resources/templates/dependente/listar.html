<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Dependentes</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Dependentes</h1>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="card">
    <div class="card-header">
      <span>Dependentes cadastrados</span>
    </div>
    <div class="card-body">

      <table class="tabela">
        <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Recebedor</th>
          <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${page.content}">
          <td th:text="${d.nome}">Maria dos Santos</td>
          <td th:text="${d.idade}">7</td>
          <td th:text="${d.recebedor.nomeCompleto}">João da Silva</td>
          <td class="acoes">
            <a class="botao botao-pequeno" th:href="@{/dependente/editar/{id}(id=${d.id})}">Editar</a>
            <form class="form-linha" method="post"
                  th:action="@{/dependente/apagar/{id}(id=${d.id})}">
              <button class="botao botao-pequeno botao-perigo" type="submit">Apagar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>

      <p class="vazio" th:if="${page.empty}">Nenhum dependente cadastrado até o momento.</p>

      <div class="pagina-acoes">
        <a class="botao botao-primario" th:href="@{/dependente/create}">Novo dependente</a>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pagination(@{/dependente}, ${page}, ${ordenacao})}"></div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
