<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Início</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Sistema de Doação</h1>

  <div class="card">
    <div class="card-header">
      <span>Recursos</span>
    </div>
    <div class="card-body">

      <table class="tabela">
        <thead>
        <tr>
          <th>Recurso</th>
          <th>Rota</th>
          <th>Situação</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td>Produtos</td>
          <td><a th:href="@{/produto}">/produto</a></td>
          <td>leitura</td>
        </tr>
        <tr>
          <td>Marcas de produto</td>
          <td>/marca-produto</td>
          <td>planejado</td>
        </tr>
        <tr>
          <td>Tipos de produto</td>
          <td>/tipo-produto</td>
          <td>planejado</td>
        </tr>
        <tr>
          <td>Residências</td>
          <td>/residencia</td>
          <td>planejado</td>
        </tr>
        <tr>
          <td>Recebedores</td>
          <td>/recebedor</td>
          <td>planejado</td>
        </tr>
        <tr>
          <td>Doações</td>
          <td>/doacao</td>
          <td>planejado</td>
        </tr>
        <tr>
          <td>Cestas</td>
          <td>/cesta</td>
          <td>planejado</td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
