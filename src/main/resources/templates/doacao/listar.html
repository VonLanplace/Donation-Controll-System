<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
    <title>Doações</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

<div th:replace="~{fragments/flash :: flash}"></div>

<div class="card">
    <div class="card-header">
        <span th:text="${titulo}">Doações</span>
    </div>
    <div class="card-body">

        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Doador</th>
                <th>Recebedor</th>
                <th>Entrevistador</th>
                <th>Itens</th>
                <th class="acoes">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${page.content}">
                <td th:text="${#temporals.format(d.data, 'dd/MM/yyyy')}">01/02/2026</td>
                <td th:text="${d.nomeDoador} ?: '—'">Doador Anônimo</td>
                <td th:text="${d.recebedor?.nomeCompleto} ?: '—'">Maria Souza</td>
                <td th:text="${d.entrevistador?.nome} ?: '—'">João Ferreiro</td>
                <td th:text="${#lists.size(d.produtos)}">2</td>
                <td class="acoes">
                    <a class="botao botao-primario" th:href="@{/doacao/detalhe/{id}(id=${d.id})}">Ver</a>
                    <a class="botao botao-pequeno" th:href="@{/doacao/editar/{id}(id=${d.id})}">Editar</a>
                    <form class="form-linha" method="post"
                          th:action="@{/doacao/apagar/{id}(id=${d.id})}">
                        <button class="botao botao-pequeno botao-perigo" type="submit">Apagar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${page.empty}">Nenhuma doação cadastrada até o momento.</p>

        <div class="pagina-acoes">
            <a class="botao botao-primario" th:href="@{/doacao/create}">Nova doação</a>
        </div>

    </div>
</div>

<div th:replace="~{fragments/pagination :: pagination(@{/doacao}, ${page}, ${ordenacao})}"></div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
