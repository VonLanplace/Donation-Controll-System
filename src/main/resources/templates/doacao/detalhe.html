<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
    <title>Doação</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

<h1 class="pagina-titulo" th:text="${#temporals.format(doacao.data, 'dd/MM/yyyy')}">01/02/2026</h1>

<div class="card">
    <div class="card-header">
        <span>Cabeçalho</span>
    </div>
    <div class="card-body">
        <dl class="descricao">
            <dt>Data</dt>
            <dd th:text="${#temporals.format(doacao.data, 'dd/MM/yyyy')}">01/02/2026</dd>

            <dt>Nome do doador</dt>
            <dd th:text="${doacao.nomeDoador} ?: '—'">Doador Anônimo</dd>

            <dt>Recebedor</dt>
            <dd>
                <a th:if="${doacao.recebedor != null}"
                   th:href="@{/recebedor/detalhe/{id}(id=${doacao.recebedor.id})}"
                   th:text="${doacao.recebedor.nomeCompleto}">Maria Souza</a>
                <span th:if="${doacao.recebedor == null}" class="valor-nulo">sem recebedor vinculado</span>
            </dd>

            <dt>Entrevistador</dt>
            <dd th:text="${doacao.entrevistador?.nome} ?: '—'">João Ferreiro</dd>
        </dl>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span>Itens da doação</span>
    </div>
    <div class="card-body">
        <table>
            <thead>
            <tr>
                <th>Produto</th>
                <th>Marca</th>
                <th>Quantidade</th>
                <th>Validade</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="linha : ${doacao.produtos}">
                <td th:text="${linha.produto.codigoBarras}">7891000100103</td>
                <td th:text="${linha.produto.marcaProduto?.nome} ?: '—'">Marca</td>
                <td th:text="${linha.quantidade}">2</td>
                <td th:text="${#temporals.format(linha.dataValidade, 'dd/MM/yyyy')}">01/03/2026</td>
            </tr>
            </tbody>
        </table>

        <div class="pagina-acoes">
            <a class="botao" th:href="@{/doacao/listar}">Voltar</a>
            <a class="botao botao-primario" th:href="@{/doacao/editar/{id}(id=${doacao.id})}">Editar</a>
        </div>
    </div>
</div>

</main>

</body>
</html>
