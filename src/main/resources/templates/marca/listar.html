<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Marcas</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Marcas</h1>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="card">
    <div class="card-header">
      <span>Marcas cadastradas</span>
    </div>
    <div class="card-body">

      <table class="tabela">
        <thead>
        <tr>
          <th>Nome</th>
          <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:each sobre page.content, nunca sobre a Page: ver PaginaView. -->
        <tr th:each="m : ${page.content}">
          <td th:text="${m.nome}">Nike</td>
          <td class="acoes">
            <!--
              Marca não tem detail: o único dado que ela tem é o nome, que já
              está na própria linha. A edição é a ação completa, e a listagem é
              a visão de uso.
            -->
            <a class="botao botao-pequeno" th:href="@{/marca/editar/{nome}(nome=${m.nome})}">Editar</a>
            <form class="form-linha" method="post"
                  th:action="@{/marca/apagar/{nome}(nome=${m.nome})}">
              <button class="botao botao-pequeno botao-perigo" type="submit">Apagar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>

      <p class="vazio" th:if="${page.empty}">Nenhuma marca cadastrada até o momento.</p>

      <div class="pagina-acoes">
        <a class="botao botao-primario" th:href="@{/marca/create}">Nova marca</a>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pagination(@{/marca}, ${page}, ${ordenacao})}"></div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
