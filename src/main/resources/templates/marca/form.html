<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('forms.css')}">
  <title th:text="${titulo}">Marca</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo" th:text="${titulo}">Nova marca</h1>

  <!--
    A mesma view serve cadastro e edição. O que muda é a action: em edição o nome
    antigo viaja na URL porque ele é a chave da marca, já que marca não tem id.
    Nome atual e nome novo podem ser diferentes — é rename.
  -->
  <form method="post" th:object="${marcaDTO}"
        th:action="${nomeAtual != null} ? @{/marca/editar/{nome}(nome=${nomeAtual})} : @{/marca/create}">

    <div class="card">
      <div class="card-header">
        <span th:text="${nomeAtual != null} ? 'Dados da marca' : 'Dados da nova marca'">Dados</span>
      </div>
      <div class="card-body">

        <div th:replace="~{fragments/erros :: erros}"></div>

        <div class="form-grade">
          <div th:replace="~{fragments/campo :: texto('nome', 'Nome da marca', true)}"></div>
        </div>

        <div th:replace="~{fragments/campo :: acoes('Salvar', @{/marca/listar})}"></div>

      </div>
    </div>

  </form>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
