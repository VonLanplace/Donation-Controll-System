<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
  <div class="logo">
    <a th:href="@{/}">Sistema de Doação</a>
  </div>
  <nav th:if="${session != null and session.entrevistadorLogado != null}">
    <!--
      Só entram rotas que existem de fato. As versões anteriores deste fragmento
      apontavam para /sobre e /contato, que nenhuma controller mapeia: eram dois
      links que davam 404 em toda página do projeto.

      O nav só aparece com sessão logada. Página pública é só /login (e o
      cadastro do primeiro entrevistador, liberado pelo interceptor), nenhuma
      delas usa header. Início fica de fora porque o logo já leva à home.
    -->
    <ul class="nav-links">
      <li><a th:href="@{/recebedor}">Recebedores</a></li>
      <li><a th:href="@{/residencia}">Residências</a></li>
      <li><a th:href="@{/dependente}">Dependentes</a></li>
      <li><a th:href="@{/despesa}">Despesas</a></li>
      <li><a th:href="@{/auxilio}">Auxílios</a></li>
      <li><a th:href="@{/doacao}">Doações</a></li>
      <li><a th:href="@{/cesta}">Cestas</a></li>
      <li><a th:href="@{/entrevistador}">Entrevistadores</a></li>
      <li><a th:href="@{/produto}">Produtos</a></li>
      <li>
        <form class="nav-sair" method="post" th:action="@{/logout}">
          <button type="submit">Sair</button>
        </form>
      </li>
    </ul>
  </nav>
</header>
</body>
</html>
