<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('forms.css')}">
  <title th:text="${titulo}">Residência</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo" th:text="${titulo}">Nova residência</h1>

  <form method="post" th:object="${residenciaDTO}"
        th:action="${id != null} ? @{/residencia/editar/{id}(id=${id})} : @{/residencia/create}">

    <div class="card">
      <div class="card-header">
        <span th:text="${id != null} ? 'Dados da residência' : 'Dados da nova residência'">Dados</span>
      </div>
      <div class="card-body">

        <div th:replace="~{fragments/erros :: erros}"></div>

        <div class="form-grade">

          <div th:replace="~{fragments/campo :: texto('logradouro', 'Logradouro', true)}"></div>
          <div th:replace="~{fragments/campo :: texto('numero', 'Número', true)}"></div>
          <div th:replace="~{fragments/campo :: texto('cep', 'CEP', true)}"></div>
          <div th:replace="~{fragments/campo :: texto('complemento', 'Complemento', false)}"></div>
          <div th:replace="~{fragments/campo :: texto('cidade', 'Cidade', true)}"></div>
          <div th:replace="~{fragments/campo :: texto('bairro', 'Bairro', true)}"></div>

          <!--
            numMoradores e numTrabalhadores são int primitivo no DTO, com
            @PositiveOrZero. Input type=number sem min deixa o usuário digitar
            negativo e o erro aparecer no servidor, que é mais lento do que
            devolver a página com a mensagem. min=0 não substitui a validação:
            o navegador valida o que ele consegue, e a constraint é a garantia.
          -->
          <div th:replace="~{fragments/campo :: campo('numMoradores', 'Número de moradores', false, 'number')}"></div>
          <div th:replace="~{fragments/campo :: campo('numTrabalhadores', 'Número de trabalhadores', false, 'number')}"></div>

          <div th:replace="~{fragments/campo :: selecao('tipoOcupacao', 'Tipo de ocupação', true, ${tiposOcupacao})}"></div>
          <div th:replace="~{fragments/campo :: selecao('tipoResidencia', 'Tipo de residência', true, ${tiposResidencia})}"></div>

        </div>

        <div th:replace="~{fragments/campo :: acoes('Salvar', @{/residencia/listar})}"></div>

      </div>
    </div>

  </form>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
