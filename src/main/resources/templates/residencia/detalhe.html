<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}">
  <title>Residência</title>
</head>
<body class="default-layout">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

  <h1 class="pagina-titulo">Residência</h1>

  <div class="card">
    <div class="card-header">
      <span>Endereço</span>
    </div>
    <div class="card-body">

      <dl class="descricao">
        <dt>Logradouro</dt>
        <dd th:text="${residencia.logradouro}">Rua das Flores</dd>

        <dt>Número</dt>
        <dd th:text="${residencia.numero}">100</dd>

        <dt>Complemento</dt>
        <dd th:text="${residencia.complemento} ?: '—'">Apto 21</dd>

        <dt>CEP</dt>
        <dd th:text="${residencia.cep}">01001000</dd>

        <dt>Cidade</dt>
        <dd th:text="${residencia.cidade}">São Paulo</dd>

        <dt>Bairro</dt>
        <dd th:text="${residencia.bairro}">Centro</dd>

        <dt>Moradores</dt>
        <dd th:text="${residencia.numMoradores}">4</dd>

        <dt>Trabalhadores</dt>
        <dd th:text="${residencia.numTrabalhadores}">2</dd>

        <!--
          O DTO traz o enum, e o enum tem getDescricao. Mostrar .name()
          mostraria "PROPRIEDADE" no lugar de "Propriedade própria".
        -->
        <dt>Tipo de ocupação</dt>
        <dd th:text="${residencia.tipoOcupacao?.descricao}">Trabalhador autônomo</dd>

        <dt>Tipo de residência</dt>
        <dd th:text="${residencia.tipoResidencia?.descricao}">Casa própria</dd>
      </dl>

      <div class="pagina-acoes">
        <a class="botao" th:href="@{/residencia/listar}">Voltar</a>
        <a class="botao botao-primario" th:href="@{/residencia/editar/{id}(id=${residencia.id})}">Editar</a>
      </div>

    </div>
  </div>

</main>

<div th:replace="~{fragments/trail :: trail}"></div>

</body>
</html>
