spring.application.name=Doacao
# Habilita o console web do H2 para você visualizar as tabelas no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Configuração da conexão (muda o nome do banco para 'meubanco')
spring.datasource.url=jdbc:h2:mem:db_doacao
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Mantém o banco vivo enquanto a aplicação estiver rodando
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Jackson 3 falha quando campo primitivo (boolean/int) vem ausente no body; desligar
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Sem teto, ?size=100000 ou ?size=1e9 devolviam HTTP 200 e o Spring tentava
# materializar a página inteira em memória. Global de propósito: vale para as
# *ViewController e para as *APIController ao mesmo tempo, sem cap manual em
# cada controller. Um POST de formulário deve respeitar isto.
spring.data.web.pageable.max-page-size=100
# logging.level.web=DEBUG